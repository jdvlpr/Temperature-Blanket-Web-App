    <rect y="128" width="1366" height="64" fill="#5aa0d8"/>
    <rect y="192" width="1366" height="64" fill="#8fcbe0"/>
    <rect y="256" width="1366" height="64" fill="#b9dfb0"/>
    <rect y="320" width="1366" height="64" fill="#e8e39a"/>
    <rect y="384" width="1366" height="64" fill="#f6d06e"/>
    <rect y="448" width="1366" height="64" fill="#f3a95a"/>
    <rect y="512" width="1366" height="64" fill="#e97d4f"/>
