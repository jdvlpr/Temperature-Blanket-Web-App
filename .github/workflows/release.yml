name: Publish Release

# Releases when the version in package.json changes: a push to main that
# touches package.json tags v<version> and publishes its GitHub Release, unless
# that tag already exists. A tag pushed by hand (v*) is released the same way,
# and "Run workflow" checks the current version on demand.
#
# One workflow on purpose: a tag created with GITHUB_TOKEN doesn't trigger
# other workflows, so tagging and releasing happen here together.

on:
  push:
    branches:
      - main
    paths:
      - package.json
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Decide Tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            # A hand-pushed tag exists already; release it unless it has a release.
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "$TAG already has a release; nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            TAG="v$(node -p "require('./package.json').version")"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "$TAG already released; nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install pnpm
        if: steps.tag.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        if: steps.tag.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        if: steps.tag.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests
        if: steps.tag.outputs.skip != 'true'
        run: pnpm test:unit
        # src/env.ts requires these to be set; placeholders are enough for unit tests.
        env:
          PUBLIC_MICROSOFT_CLARITY_ID: ci
          PUBLIC_BASE_URL: https://temperature-blanket.com
          PUBLIC_SITE_TITLE: Temperature Blanket
          PUBLIC_YARN_SEARCH_REQUEST_FORM_LINK: https://example.com
          PUBLIC_KOFI_LINK: https://example.com
          PUBLIC_WORDPRESS_BASE_URL: https://example.com
          PUBLIC_BASE_DOMAIN_NAME: temperature-blanket.com
          PUBLIC_FACEBOOK_LINK: https://example.com
          PUBLIC_GITHUB_LINK: https://example.com
          SECRET_RAPID_API_PROXY_HEADER_KEY: ci
          SECRET_METEOSTAT_API_KEY: ci
          SECRET_METEOSTAT_DEV_API_KEY: ci
          SECRET_WORDPRESS_PROJECT_CREATION_AUTH_KEY: ci
          SECRET_GEONAMES_USERNAME: ci
          PUBLIC_GOOGLE_API_KEY: ci
          PUBLIC_GOOGLE_CLIENT_ID: ci
          PUBLIC_SUPPORTERS: ci
          PUBLIC_COOLORS_LINK: https://example.com

      - name: Create Tag and Release
        if: steps.tag.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
